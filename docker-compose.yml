# One command runs the whole product:  cp .env.example .env  &&  docker compose up --build
# Web: http://localhost:8080   API: http://localhost:5000/api/health
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: greenorb
      POSTGRES_PASSWORD: greenorb
      POSTGRES_DB: greenorb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenorb"]
      interval: 5s
      retries: 20

  api:
    build: ./Backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://greenorb:greenorb@db:5432/greenorb
      PORT: "5000"
      NODE_ENV: production
      ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    restart: unless-stopped

  worker:
    build: ./worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://greenorb:greenorb@db:5432/greenorb
    depends_on:
      api:
        condition: service_healthy   # the API runs the migrations
    volumes:
      # Optional: mount a folder of PDFs for `docker compose run worker python -m greenorb_worker bulk /reports`
      - ${REPORTS_DIR:-./Backend/downloaded_reports}:/reports:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
