# Free alternative to an always-on worker: every 30 minutes (or on demand) GitHub Actions
# processes whatever is queued, then exits. When the queue is short it first queues a few new
# public reports from worker/seeds/*.csv, so the database keeps growing on its own. Add the repository secrets DATABASE_URL and,
# optionally, GROQ_API_KEY / GEMINI_API_KEY. Without DATABASE_URL the job is a no-op.
name: Process report queue

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: greenorb-worker
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Skip when not configured
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret not set; nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - if: steps.cfg.outputs.skip != 'true'
        working-directory: worker
        run: sudo apt-get install -y tesseract-ocr >/dev/null && pip install -r requirements.txt
      - if: steps.cfg.outputs.skip != 'true'
        working-directory: worker
        run: python -m greenorb_worker drain --max-jobs 25 --harvest ${{ vars.HARVEST_PER_RUN || 8 }}
